[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlift"
version = "0.1.0"
description = "LLM customer agents simulate a real randomized A/B test; measure simulation fidelity against the real treatment effects."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Dheepak Karan Elumalai Santhakumari" }]
dependencies = [
  "pandas",
  "numpy",
  "scipy",
  "statsmodels",
  "scikit-learn",
  "pydantic>=2",
  "pyyaml",
  "python-dotenv",
  "tqdm",
]

[project.optional-dependencies]
data = ["scikit-uplift"]
llm = ["groq", "google-genai"]
viz = ["streamlit", "plotly"]
track = ["mlflow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
