# AgentLift run configuration.
seed: 42

data:
  outcome: visit
  cache_dir: data/raw

sample:
  stratify_by: history_segment
  quick:
    main: 100
    ablation: 30
  full:
    main: 300
    ablation: 60

simulation:
  conditions: [mens, womens, none]
  persona_level: full
  framing: neutral
  temperature: 0.7
  model_size: large

llm:
  provider: mock
  concurrency: 8
  requests_per_minute: 28
  max_retries: 3
  cache_path: data/raw/llm_cache.sqlite

fidelity:
  bootstrap_resamples: 2000
  min_segment_n: 15

ablations:
  A1_persona: [full, minimal]
  A2_model: [large, small]
  A3_temperature: [0.7, 0.0]
  A4_framing: [neutral, realism]
